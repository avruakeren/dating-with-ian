<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>thanks</title>
    <link rel="stylesheet" href="flower.css" />
    <script src="config.js"></script>
    <style>
      body {
        overflow-x: hidden;
        overflow-y: auto;
        padding: 8px 12px 20px;
      }

      #thankyou {
        margin-bottom: 18px !important;
        font-size: clamp(30px, 8vw, 50px) !important;
      }

      .cute-card {
        z-index: 1200;
        width: min(500px, 92vw);
        text-align: center;
        background: rgba(255, 255, 255, 0.86);
        color: #d9487d;
        border-radius: 18px;
        padding: 14px 16px;
        margin-top: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        backdrop-filter: blur(2px);
      }

      .cute-card h2 {
        margin: 0;
        font-size: clamp(22px, 6vw, 30px);
      }

      .cute-card p {
        margin: 6px 0;
        font-size: clamp(14px, 4.2vw, 18px);
      }

      .heart-row {
        font-size: clamp(18px, 5.5vw, 24px);
        letter-spacing: 4px;
        animation: bop 1.2s ease-in-out infinite;
      }

      .cat-sticker {
        width: clamp(84px, 24vw, 120px);
        margin-top: 8px;
      }

      .flower {
        transform: scale(0.92);
        transform-origin: center top;
      }

      @media (max-width: 640px) {
        .flower {
          transform: scale(0.72);
          margin-top: -36px;
        }
      }

      @keyframes bop {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-6px);
        }
      }
    </style>
  </head>
  <body>
    <div id="thankyou"><b>thank u ian!</b></div>

    <section class="cute-card">
      <h2>Yeay! hangout approved</h2>
      <p id="summary"></p>
      <p id="funText"></p>
      <div class="heart-row">✨ 🌸 ✨ 🌸 ✨</div>
      <img src="lucu.gif" alt="cute cat" class="cat-sticker" />
    </section>

    <div class="flower">
      <div class="f-wrapper">
        <div class="flower__line"></div>
        <div class="f">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__leaf flower__leaf--5"></div>
          <div class="flower__leaf flower__leaf--6"></div>
          <div class="flower__leaf flower__leaf--7"></div>
          <div class="flower__leaf flower__leaf--8 flower__fall-down--yellow"></div>
        </div>
      </div>

      <div class="f-wrapper f-wrapper--2">
        <div class="flower__line"></div>
        <div class="f">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__leaf flower__leaf--5"></div>
          <div class="flower__leaf flower__leaf--6"></div>
          <div class="flower__leaf flower__leaf--7"></div>
          <div class="flower__leaf flower__leaf--8 flower__fall-down--pink"></div>
        </div>
      </div>

      <div class="f-wrapper f-wrapper--3">
        <div class="flower__line"></div>
        <div class="f">
          <div class="flower__leaf flower__leaf--1"></div>
          <div class="flower__leaf flower__leaf--2"></div>
          <div class="flower__leaf flower__leaf--3"></div>
          <div class="flower__leaf flower__leaf--4"></div>
          <div class="flower__leaf flower__leaf--5"></div>
          <div class="flower__leaf flower__leaf--6"></div>
          <div class="flower__leaf flower__leaf--7"></div>
          <div class="flower__leaf flower__leaf--8 flower__fall-down--purple"></div>
        </div>
      </div>
      <div class="flower__glass"></div>
    </div>

    <script>
      var chosenDate = localStorage.getItem("chosenDate") || "belum diisi";
      var selectedPlaces = JSON.parse(localStorage.getItem("selectedPlaces") || "[]");
      var placesLabel = selectedPlaces.length ? selectedPlaces.join(", ") : "surprise place";

      document.getElementById("summary").textContent =
        "Tanggal: " + chosenDate + " | Tempat: " + placesLabel;

      var jokes = [
        "i'll be there no matter what (anjay)",
        "jangan tiba tiba dicancel yaa",
        "siap ga siap gw susul hahaha",
      ];
      document.getElementById("funText").textContent = jokes[Math.floor(Math.random() * jokes.length)];

      var inboxKey = "inboxSubmissions";
      var inboxItems = JSON.parse(localStorage.getItem(inboxKey) || "[]");
      var signature = chosenDate + "|" + selectedPlaces.slice().sort().join("|");
      var latest = inboxItems[0];

      if (!latest || latest.signature !== signature) {
        inboxItems.unshift({
          id: Date.now(),
          createdAt: new Date().toISOString(),
          chosenDate: chosenDate,
          places: selectedPlaces,
          signature: signature,
        });

        if (inboxItems.length > 30) {
          inboxItems = inboxItems.slice(0, 30);
        }

        localStorage.setItem(inboxKey, JSON.stringify(inboxItems));
      }

      fetch(INSFORGE_BASE_URL + "/api/database/records/submissions", {
        method: "POST",
        headers: {
          Authorization: "Bearer " + INSFORGE_API_KEY,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates",
        },
        body: JSON.stringify([
          {
            chosen_date: chosenDate,
            places: selectedPlaces,
            signature: signature,
          },
        ]),
      });
    </script>
  </body>
</html>
